name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Prepare bundled SVN runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Slik-Subversion-1.14.5-x64.zip'
          Invoke-WebRequest -Uri 'https://sliksvn.com/pub/Slik-Subversion-1.14.5-x64.zip' -OutFile $archive
          $extract = Join-Path $env:RUNNER_TEMP 'sliksvn'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $msi = Get-ChildItem -LiteralPath $extract -Filter '*.msi' -File | Select-Object -First 1
          if (-not $msi) { throw 'SlikSVN MSI was not found.' }
          $install = Start-Process msiexec.exe -ArgumentList '/i', $msi.FullName, '/qn', '/norestart' -Wait -PassThru -NoNewWindow
          if ($install.ExitCode -ne 0) { throw "SlikSVN installation failed with exit code $($install.ExitCode)." }
          $svnPath = @(
            (Get-Command svn.exe -ErrorAction SilentlyContinue).Source,
            (Join-Path $env:ProgramFiles 'SlikSvn/bin/svn.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'SlikSvn/bin/svn.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $svnPath) { throw 'SlikSVN installation did not provide svn.exe.' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-svn-runtime.ps1 -SourceDirectory (Split-Path -Parent $svnPath)
          if ($LASTEXITCODE -ne 0) { throw 'Bundled SVN runtime preparation failed.' }
      - name: Verify version and signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets first.' }
          node scripts/release-version.mjs --check $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm test -- --maxWorkers=2
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --jobs 2 -- --test-threads=2
      - name: Build signed installer and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HQ Git v__VERSION__
          releaseBody: 'Windows x64 安装包。已有支持自动更新的安装版可在「设置 → 版本更新」中下载并安装。'
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --target x86_64-pc-windows-msvc --ci
